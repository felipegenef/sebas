# ci.yml — every push/PR proves the plugin on the three desktop platforms.
#
# Why real GitHub-hosted runners (not containers): the install smoke exercises
# the per-platform installers (setup.sh / setup.ps1) and the per-platform venv
# layout, and macOS cannot be containerized at all — the hosted macOS VM is
# the standard way to verify a Mac install.
#
# Read-only by design: no secrets are used here and nothing is published.
# Publishing lives in release.yml and only on v* tags.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml reuses this workflow as its pre-publish test gate, so the two
  # can never drift apart: one source of truth for what "tests pass" means.
  workflow_call:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- unit
  # The suites (tests/ = Python, plugin/test/ = bun) are host-independent by
  # design: no OpenCode, no audio, no daemon. This job proves that claim on
  # every OS.
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2

      - name: Python suite (242+ tests)
        shell: bash
        env:
          # Cross-platform env syntax: the tests find the voice MCP tree
          # through SEBAS_MCP_ROOT (tests/README.md) and skip loudly without
          # it — setting it here keeps the suite honest on all three OSes.
          SEBAS_MCP_ROOT: ${{ github.workspace }}/plugin/mcp/voice
        run: python -m unittest discover -s tests -v

      - name: Build, typecheck and bun tests (122+ tests)
        shell: bash
        working-directory: plugin
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run check
          bun test

  # -------------------------------------------------------- install-smoke
  # The real prize: install the PUBLISHED artifact (npm pack tarball, never
  # the checkout), run the platform installer for real, then talk JSON-RPC to
  # the installed server and prove synthesis. This is the job that would have
  # caught a broken setup.ps1 — it runs on windows-latest for real.
  install-smoke:
    name: install-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Scratch data home for the whole job: installer, server and probe all
      # resolve their data dir from XDG_DATA_HOME (voice/core.py and both
      # setup scripts honour it), so NOTHING touches the runner's real home.
      # It is also deliberately short: Windows caps the daemon's AF_UNIX
      # socket path at ~108 characters (README, Troubleshooting).
      XDG_DATA_HOME: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2

      # The Kokoro weights (~300 MB) are byte-identical on every OS and only
      # change when the kokoro-onnx release does (the model-files-v1.0 tag in
      # the download URL that setup.sh/setup.ps1 use). Caching <data>/models
      # means the download happens ONCE per OS — the first run per OS pays
      # it, every later run restores — instead of ~300 MB per job per run.
      # The runner.os suffix keeps entries per-OS; cache archives do not
      # reliably restore across OSes.
      - name: Cache the Kokoro model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ci-data/models
          key: kokoro-models-model-files-v1.0-${{ runner.os }}

      - name: Pack the plugin and install the tarball into a temp prefix
        shell: bash
        run: |
          set -euo pipefail
          cd plugin
          bun install --frozen-lockfile
          bun run build
          mkdir -p ../.ci-pack
          npm pack --pack-destination ../.ci-pack
          cd ..
          npm install --prefix .ci-prefix .ci-pack/*.tgz
          # The published artifact must carry everything the plugin resolves
          # at runtime — this asserts the tarball, not the checkout.
          PKG=.ci-prefix/node_modules/@felipegenef/opencode-sebas
          test -f "$PKG/index.js"
          test -f "$PKG/mcp/voice/server.py"
          test -f "$PKG/mcp/voice/run.sh"
          test -f "$PKG/mcp/voice/setup.sh"
          test -f "$PKG/mcp/voice/setup.ps1"
          test -f "$PKG/notify/__init__.py"
          echo "installed artifact OK: $PKG"

      - name: Probe the first-load "installing" state
        shell: bash
        run: |
          set -euo pipefail
          # Before any setup runs: the server must answer {"status":
          # "installing"} clearly instead of crashing — the exact reply the
          # first OpenCode load shows while the plugin installs the runtime
          # in the background. stdlib-only server, so the system python is
          # what a fresh machine would use here.
          VOICE=.ci-prefix/node_modules/@felipegenef/opencode-sebas/mcp/voice
          python scripts/rpc_probe.py --mode installing --data-home .ci-data -- \
            python "$VOICE/server.py"

      - name: Run the installer (setup.sh)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # The real installer against the scratch data dir. With the cache
          # restored above the weights are already in place and only the venv
          # is created; on a cache miss this step pays the ~300 MB download
          # (once per OS, then the cache takes over).
          bash .ci-prefix/node_modules/@felipegenef/opencode-sebas/mcp/voice/setup.sh

      - name: Run the installer (setup.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ".ci-prefix\node_modules\@felipegenef\opencode-sebas\mcp\voice\setup.ps1"
        # ^ the documented invocation, run for real: this is the machine
        #   check setup.ps1 never had.

      - name: Probe voice_status + speak(play:false) through the installed server
        shell: bash
        run: |
          set -euo pipefail
          VOICE=.ci-prefix/node_modules/@felipegenef/opencode-sebas/mcp/voice
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Windows has no run.sh: the plugin launches the venv interpreter
            # directly (plugin/src/config.ts) — do exactly that.
            python scripts/rpc_probe.py --mode ok --data-home .ci-data -- \
              .ci-data/venv/Scripts/python.exe "$VOICE/server.py"
          else
            # POSIX: `bash run.sh` is what the plugin resolves.
            python scripts/rpc_probe.py --mode ok --data-home .ci-data -- \
              bash "$VOICE/run.sh"
          fi
          # The probe asserts: voice_status {"status":"ok"} with the model
          # present, a real .wav produced, and "played": false — play:false is
          # hardcoded in the probe, so nothing ever reaches a speaker (CI
          # runners have none anyway).

  # ------------------------------------------------------------ package
  # Fast guard against shipping caches/junk: npm prints exactly what a real
  # publish would upload. No auth needed for --dry-run, and no publish ever
  # happens here.
  package:
    name: package (npm publish --dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2

      - name: Publish dry run
        shell: bash
        working-directory: plugin
        run: |
          bun install --frozen-lockfile
          bun run build
          npm publish --dry-run --access public
